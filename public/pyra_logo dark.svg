<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" fill="none">
  <defs>
    <filter id="glow-light" x="45" y="0" width="30" height="30" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pulse Line (Obsidian Dark) -->
  <path
    d="M10 54 H26 L33 44 L41 68 L48 54 L60 22 L72 82 L82 44 L90 62 L96 54 H110"
    stroke="#14161B"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Apex Beacon Dot (Ember Orange) -->
  <circle
    cx="60"
    cy="12"
    r="5"
    fill="#E8622C"
    filter="url(#glow-light)"
  />
</svg>
